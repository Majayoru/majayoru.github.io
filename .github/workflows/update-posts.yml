name: Update Latest Notes

# 하루 4번(한국시간 09, 15, 21, 03시) + 수동 실행 + main 푸시 때 티스토리 새 글을 가져옵니다.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [posts.json]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest Tistory posts
        run: node scripts/fetch-posts.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet posts.json; then
            echo "새 글 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "chore: update latest notes"
            git push
          fi
